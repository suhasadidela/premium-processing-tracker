<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>EAD Card Delivery Tracker</title>
<meta name="description" content="Elapsed time from I-765 approval to physical card delivery, against a typical range." />
<meta name="theme-color" content="#0A0E14" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0E14;
    --surface: #10151D;
    --surface-hi: #161C26;
    --border: #232B38;
    --text: #E7ECF3;
    --dim: #6E7A8A;
    --cyan: #4CC9F0;
    --amber: #F5A623;
    --red: #FF5C5C;
    --green: #4ADE80;
    --seg-off: #1B222D;
    --status: var(--cyan);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  .frame {
    padding: clamp(12px, min(3vw, 2.2vh), 36px);
    position: relative;
    z-index: 2;
    width: 100%;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: clamp(10px, min(3vw, 1.9vh), 30px) clamp(18px, 3.5vw, 48px) clamp(11px, min(3.5vw, 2vh), 32px);
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    /* Hero sizes off the card, not the viewport — the card stops growing at 900px */
    container-type: inline-size;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  .eyebrow {
    color: var(--dim);
    font-size: clamp(11px, 1.1vw, 15px);
    letter-spacing: 0.12em;
    font-weight: 600;
    line-height: 1;
  }
  .cursor { color: var(--cyan); animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .header-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .today-line {
    color: var(--text);
    font-size: clamp(12px, 1.2vw, 17px);
    letter-spacing: 0.1em;
    font-weight: 700;
    line-height: 1;
    margin-top: 15px;
  }
  .uscis-link {
    display: inline-block;
    color: var(--cyan);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: clamp(10px, 0.95vw, 13px);
    font-weight: 600;
    letter-spacing: 0.08em;
    white-space: nowrap;
    transition: border-color 160ms ease, background 160ms ease;
  }
  .uscis-link:hover, .uscis-link:focus-visible {
    border-color: var(--cyan);
    background: rgba(76,201,240,0.08);
  }
  .hero { text-align: center; margin-top: clamp(11px, 1.8vh, 26px); user-select: none; }
  .hero-row {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: clamp(10px, 6cqw, 58px);
    flex-wrap: nowrap;
  }
  .hero-num {
    color: var(--status);
    /* Two segments, not index.html's four, so the digits are scaled up hard to
       carry comparable visual weight and anchor the card rather than floating
       as a small island in the middle of it. */
    font-size: clamp(34px, min(19cqw, 12.2vh), 150px);
    white-space: nowrap;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    transition: color 300ms ease;
  }
  .hero-unit { font-size: 0.3em; color: var(--dim); margin-left: 6px; font-weight: 600; letter-spacing: 0.1em; }
  .hero-label {
    color: var(--dim);
    font-size: clamp(11px, 1.15vw, 16px);
    letter-spacing: 0.15em;
    /* Clear air under the clock — it was reading as one crowded block with
       its label, caption and the pill. */
    margin-top: clamp(9px, 1.7vh, 22px);
  }
  /* The tilde is load-bearing: ~12 is a typical range, never a deadline. */
  .hero-caption {
    color: var(--text);
    font-size: clamp(10px, 1vw, 14px);
    letter-spacing: 0.12em;
    font-weight: 700;
    margin-top: clamp(6px, 1vh, 12px);
  }
  /* The pill is its own element, not a tail on the caption */
  .status-wrap { text-align: center; margin: clamp(12px, 2.1vh, 28px) 0 clamp(11px, 1.9vh, 24px); }
  .status-pill {
    display: inline-block;
    border: 1px solid var(--status);
    color: var(--status);
    box-shadow: 0 0 12px color-mix(in srgb, var(--status) 33%, transparent);
    border-radius: 999px;
    padding: clamp(5px, 0.7vw, 9px) clamp(14px, 1.6vw, 24px);
    font-size: clamp(11px, 1.15vw, 16px);
    letter-spacing: 0.1em;
    font-weight: 700;
  }

  /* ---- day grid: same LED language as index.html, but the track can grow ---- */
  .day-grid {
    display: grid;
    gap: clamp(2px, 0.3vw, 5px);
    width: 100%;
  }
  .day {
    position: relative;
    width: 100%;
    height: clamp(13px, min(3.1vw, 3.2vh), 38px);
    border-radius: 4px;
    background: var(--seg-off);
  }
  /* Every elapsed day lights, like index.html's segment bar */
  .day.lit {
    background: var(--cyan);
    box-shadow: 0 0 6px color-mix(in srgb, var(--cyan) 53%, transparent);
  }
  /* Past the typical range is longer-than-usual, not late. Amber, never red. */
  .day.over { background: var(--amber); box-shadow: 0 0 6px color-mix(in srgb, var(--amber) 53%, transparent); }
  .day.over-future { background: var(--seg-off); opacity: 0.8; }
  .day.today { animation: pulse 1.4s ease-in-out infinite; }
  .day.delivered { background: var(--green); box-shadow: 0 0 6px color-mix(in srgb, var(--green) 53%, transparent); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ---- stage pipeline ---- */
  .pipeline { margin: clamp(11px, 1.8vh, 24px) 0 0; }
  .stage {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: clamp(8px, 1.2vw, 16px);
    padding: clamp(2px, 0.3vh, 6px) 0;
    border-bottom: 1px solid var(--border);
  }
  .stage:last-child { border-bottom: 0; }
  .stage-dot {
    width: clamp(8px, 0.9vw, 11px);
    height: clamp(8px, 0.9vw, 11px);
    border-radius: 50%;
    background: var(--seg-off);
    border: 1px solid var(--border);
    flex: none;
  }
  .stage-name {
    color: var(--dim);
    font-size: clamp(10px, 1.05vw, 15px);
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .stage-date {
    color: var(--border);
    font-size: clamp(9px, 0.95vw, 13px);
    letter-spacing: 0.06em;
    font-weight: 600;
    white-space: nowrap;
  }
  .stage.done .stage-dot { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px color-mix(in srgb, var(--cyan) 55%, transparent); }
  .stage.done .stage-name { color: var(--text); }
  .stage.done .stage-date { color: var(--cyan); }
  .stage.next .stage-dot { background: var(--cyan); border-color: var(--cyan); animation: pulse 1.4s ease-in-out infinite; }
  .stage.next .stage-name { color: var(--dim); }
  .stage.final.done .stage-dot { background: var(--green); border-color: var(--green); box-shadow: 0 0 8px color-mix(in srgb, var(--green) 55%, transparent); }
  .stage.final.done .stage-date { color: var(--green); }
  /* Personal vs USCIS stages render identically — the distinction is kept in
     CONFIG for the record, not drawn on screen. */

  /* ---- notes: deliberately below the pipeline and quieter than it, so an
         observation can never be mistaken for an official USCIS stage ---- */
  .notes { margin-top: clamp(7px, 1.1vh, 15px); }
  /* Notes accumulate without bound over a long wait, so the block is capped and
     scrolls internally. Otherwise invariant 3 holds today and quietly breaks on
     whichever note pushes the card past the fold. */
  #notesList {
    max-height: clamp(20px, 4.4vh, 42px);
    overflow-y: auto;
  }
  .notes-head {
    color: var(--dim);
    font-size: clamp(8.5px, 0.85vw, 11px);
    letter-spacing: 0.14em;
    font-weight: 700;
    margin-bottom: clamp(3px, 0.5vh, 6px);
  }
  /* Readable, not decorative — these were previously dim enough to be
     effectively invisible while still occupying space. */
  .note {
    color: var(--text);
    font-size: clamp(9.5px, 0.95vw, 13px);
    letter-spacing: 0.04em;
    line-height: 1.4;
  }
  .note-date { color: var(--dim); font-weight: 700; }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(10px, 1.4vw, 20px);
    margin: clamp(11px, 1.8vh, 24px) 0 clamp(11px, 1.8vh, 22px);
  }
  /* Closing element, same treatment as index.html's date row: full width, thin
     rule above, dim label over value. */
  .footer-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 1px solid var(--border);
    padding-top: clamp(10px, 1.7vh, 20px);
    gap: 8px;
  }
  .footer-label { color: var(--dim); font-size: clamp(10px, min(1vw, 1.6vh), 14px); letter-spacing: 0.08em; }
  .footer-val {
    color: var(--text);
    font-size: clamp(13px, min(1.5vw, 2.3vh), 21px);
    font-weight: 600;
    margin-top: clamp(3px, 0.6vh, 8px);
  }
  /* Grid stretches both boxes to the taller one's height. Without centering,
     the box holding the shorter value sits its content against the top with
     dead space beneath, so the two cards read as misaligned. */
  .stat-box {
    background: var(--surface-hi);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: clamp(9px, min(1.8vw, 1.55vh), 20px) clamp(10px, 1.4vw, 18px);
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .stat-val {
    color: var(--text);
    font-size: clamp(24px, min(3.4vw, 4.6vh), 48px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    color: var(--dim);
    font-size: clamp(9px, 1vw, 13px);
    letter-spacing: 0.08em;
    margin-top: clamp(4px, 0.8vh, 9px);
  }

  .links-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(8px, 1vw, 14px);
    max-width: 900px;
    margin: clamp(8px, 1.4vh, 18px) auto 0;
  }
  .ext-link {
    color: var(--dim);
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    /* vertical padding capped by vh so this row can't push the card off a
       short screen — see invariant 3 in the README */
    padding: clamp(5px, min(0.8vw, 1.1vh), 10px) clamp(10px, 1.3vw, 18px);
    font-size: clamp(9px, 0.9vw, 12px);
    font-weight: 600;
    letter-spacing: 0.1em;
    white-space: nowrap;
    transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
  }
  .ext-link:hover, .ext-link:focus-visible {
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(76,201,240,0.08);
  }
  .lbl-narrow { display: none; }

  /* On a small phone the clamps are already at their floors, so the only room
     left is in the fixed minimums themselves — five pipeline rows plus notes
     otherwise overflow a 320px-tall-ish screen. */
  /* The notes block is optional and costs real height. Rather than shrink the
     layout permanently for content that is usually absent, the page tightens
     only while notes exist — so the roomy proportions stand in the common case
     and invariant 3 still holds in the populated one. */
  body.has-notes .hero-num { font-size: clamp(30px, min(19cqw, 10.4vh), 120px); }
  body.has-notes .hero { margin-top: clamp(9px, 1.3vh, 20px); }
  body.has-notes .status-wrap { margin: clamp(9px, 1.5vh, 20px) 0 clamp(8px, 1.4vh, 18px); }
  body.has-notes .pipeline { margin-top: clamp(9px, 1.3vh, 18px); }
  body.has-notes .stat-grid { margin: clamp(9px, 1.3vh, 18px) 0 clamp(9px, 1.3vh, 16px); }
  body.has-notes .stat-box { padding: clamp(7px, min(1.8vw, 1.1vh), 15px) clamp(10px, 1.4vw, 18px); }
  body.has-notes .stat-val { font-size: clamp(22px, min(3.4vw, 3.5vh), 40px); }

  @media (max-width: 420px) {
    .lbl-wide { display: none; }
    .lbl-narrow { display: inline; }
    .links-row { gap: 6px; }
    .ext-link { font-size: 8.5px; padding: 5px 8px; letter-spacing: 0.08em; }
    .stage-name { letter-spacing: 0.02em; }
    /* Sized when the card carried six stages plus a notes block. With five
       stages the phone layout has room again, so gaps match the card's own
       padding instead of bunching in the middle. */
    /* Height-aware rather than fixed: these were pinned to the values a short
       phone needs, so a tall one kept the cramped layout and left a third of
       the screen empty. Now a 812px phone gets index.html's proportions and a
       568px one still fits. */
    .card { padding: clamp(10px, min(4.5vw, 2.2vh), 26px) clamp(18px, 3.5vw, 48px) clamp(11px, min(4.5vw, 2.3vh), 28px); }
    .hero { margin-top: clamp(8px, 1.7vh, 20px); }
    .hero-num { font-size: clamp(26px, min(18cqw, 7vh), 92px); }
    .hero-label { margin-top: clamp(6px, 1.1vh, 13px); }
    .status-wrap { margin: clamp(8px, 1.7vh, 20px) 0 clamp(8px, 1.7vh, 20px); }
    .day { height: clamp(10px, min(5.5vw, 2.6vh), 26px); }
    .stage { padding: clamp(1px, 0.45vh, 5px) 0; }
    .pipeline { margin-top: clamp(8px, 1.7vh, 20px); }
    .stat-grid { margin: clamp(8px, 1.7vh, 20px) 0 clamp(8px, 1.7vh, 18px); }
    .stat-box { padding: clamp(4px, 1.1vh, 12px) clamp(8px, 1.4vw, 16px); }
    .stat-val { font-size: clamp(14px, 2.7vh, 24px); }
    /* Three date columns don't fit a phone at full size — the values wrapped
       to two lines and pushed the card off screen. Same treatment index.html
       uses at this width. */
    .footer-row { padding-top: clamp(8px, 1.5vh, 16px); gap: 4px; }
    .footer-val { font-size: clamp(9px, 1.35vh, 12px); margin-top: clamp(2px, 0.4vh, 5px); }
    .footer-label { font-size: clamp(8px, 1.1vh, 10px); letter-spacing: 0.03em; }
    /* Notes have to be very tight here; the block still scrolls rather than
       pushing the card off a small phone. */
    .notes { margin-top: 5px; }
    .notes-head { font-size: 8px; margin-bottom: 2px; }
    .note { font-size: 9px; line-height: 1.35; }
    #notesList { max-height: clamp(16px, 3.6vh, 34px); }
    /* has-notes outranks this block on specificity, so its phone values are
       restated here — otherwise it would enlarge things on a small screen. */
    body.has-notes .hero-num { font-size: clamp(22px, min(15cqw, 6vh), 92px); }
    body.has-notes .hero { margin-top: clamp(6px, 1.3vh, 16px); }
    body.has-notes .status-wrap { margin: clamp(6px, 1.3vh, 16px) 0 clamp(6px, 1.3vh, 16px); }
    body.has-notes .pipeline { margin-top: clamp(6px, 1.3vh, 16px); }
    body.has-notes .stat-grid { margin: clamp(6px, 1.3vh, 16px) 0 clamp(6px, 1.3vh, 14px); }
    body.has-notes .stat-box { padding: clamp(3px, 0.9vh, 10px) clamp(8px, 1.4vw, 16px); }
    body.has-notes .stat-val { font-size: clamp(13px, 2.2vh, 20px); }
  }
  /* Short phones (SE-sized). The height-aware phone values above are tuned for
     a 812px screen; on a 568px one they overflow, so this restores the tight
     layout only where the height actually demands it. */
  @media (max-width: 420px) and (max-height: 680px) {
    .card { padding: 10px clamp(18px, 3.5vw, 48px) 11px; }
    .hero { margin-top: 8px; }
    .hero-num { font-size: clamp(24px, min(15cqw, 7vh), 92px); }
    .hero-label { margin-top: 6px; }
    .status-wrap { margin: 8px 0 8px; }
    .day { height: clamp(10px, min(3.6vw, 2.1vh), 22px); }
    .stage { padding: 1px 0; }
    .pipeline { margin-top: 8px; }
    .stat-grid { margin: 8px 0 8px; }
    .stat-box { padding: 4px 8px; }
    .stat-val { font-size: 15px; }
    .footer-row { padding-top: 8px; }
    .footer-val { font-size: 9px; margin-top: 2px; }
    .footer-label { font-size: 8px; }
    #notesList { max-height: clamp(14px, 4vh, 26px); }
    body.has-notes .hero-num { font-size: clamp(22px, min(13cqw, 6vh), 92px); }
    body.has-notes .hero { margin-top: 6px; }
    body.has-notes .status-wrap { margin: 6px 0 6px; }
    body.has-notes .pipeline { margin-top: 6px; }
    body.has-notes .stat-grid { margin: 6px 0 6px; }
    body.has-notes .stat-box { padding: 3px 8px; }
    body.has-notes .stat-val { font-size: 13px; }
  }

  /* Short landscape. This page carries a 5-row pipeline plus notes on top of
     everything index.html has, so the whole rhythm tightens, not just the hero. */
  @media (max-height: 700px) and (min-width: 900px) {
    .hero-num { font-size: clamp(28px, min(13cqw, 8.6vh), 96px); }
    /* Keep the rhythm even here too: with the card's own padding at ~16px,
       6px gaps between blocks made the middle bunch while the edges idled. */
    .card { padding-top: clamp(12px, 2vh, 26px); padding-bottom: clamp(12px, 2vh, 28px); }
    .hero { margin-top: clamp(8px, 1.5vh, 18px); }
    .day { height: clamp(12px, min(2.4vw, 2.9vh), 30px); }
    .status-wrap { margin: clamp(8px, 1.35vh, 17px) 0 clamp(8px, 1.35vh, 17px); }
    .stage { padding: clamp(2px, 0.4vh, 6px) 0; }
    .pipeline { margin-top: clamp(8px, 1.5vh, 18px); }
    .stat-grid { margin: clamp(8px, 1.5vh, 18px) 0 clamp(8px, 1.5vh, 16px); }
    .stat-box { padding: clamp(5px, 0.9vh, 12px) clamp(10px, 1.4vw, 18px); }
    .stat-val { font-size: clamp(18px, min(2.6vw, 3vh), 32px); }
    .notes { margin-top: clamp(3px, 0.45vh, 8px); }
    .notes-head { margin-bottom: 2px; font-size: 8px; }
    #notesList { max-height: clamp(17px, 3.1vh, 26px); }
    .stat-box { padding: clamp(6px, 1.2vh, 14px) clamp(10px, 1.4vw, 18px); }
    .footer-row { padding-top: clamp(8px, 1.3vh, 16px); }
    .footer-val { font-size: clamp(12px, 1.9vh, 16px); }
    .footer-label { font-size: clamp(9px, 1.4vh, 12px); }
    body.has-notes .hero-num { font-size: clamp(24px, min(13cqw, 7.6vh), 96px); }
    body.has-notes .stat-val { font-size: clamp(16px, min(2.6vw, 2.7vh), 30px); }
    body.has-notes .stat-box { padding: clamp(5px, 1vh, 12px) clamp(10px, 1.4vw, 18px); }
    body.has-notes .stat-grid { margin: clamp(7px, 1.2vh, 15px) 0 clamp(7px, 1.2vh, 14px); }
    body.has-notes .status-wrap { margin: clamp(7px, 1.2vh, 15px) 0 clamp(7px, 1.2vh, 15px); }
    body.has-notes .pipeline { margin-top: clamp(7px, 1.2vh, 15px); }
    body.has-notes .hero { margin-top: clamp(7px, 1.2vh, 15px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="card">

    <div class="header-row">
      <div>
        <div class="eyebrow">EAD_CARD // DELIVERY <span class="cursor">█</span></div>
        <div class="today-line" id="todayLine"></div>
      </div>
      <div class="header-right">
        <a class="uscis-link" id="uscis" href="https://egov.uscis.gov/" target="_blank" rel="noopener noreferrer">CHECK STATUS ↗</a>
        <a class="uscis-link" id="trackLink" href="https://tools.usps.com/tracking/?locale=en" target="_blank" rel="noopener noreferrer">USPS TRACKING ↗</a>
      </div>
    </div>

    <div class="hero">
      <div class="hero-row" id="heroRow"></div>
      <div class="hero-label" id="heroLabel"></div>
      <div class="hero-caption" id="heroCaption"></div>
    </div>

    <div class="status-wrap">
      <span class="status-pill" id="statusPill"></span>
    </div>

    <div class="day-grid" id="dayGrid"></div>

    <div class="pipeline" id="pipeline"></div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-val" id="sinceMove"></div>
        <div class="stat-label" id="sinceMoveLabel">DAYS SINCE LAST STAGE</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stageCount"></div>
        <div class="stat-label">STAGES COMPLETE</div>
      </div>
    </div>

    <div class="footer-row">
      <div style="text-align:left">
        <div class="footer-label">APPROVED</div>
        <div class="footer-val" id="fApproved"></div>
      </div>
      <div style="text-align:center">
        <div class="footer-label">IN PORTAL</div>
        <div class="footer-val" id="fPortal"></div>
      </div>
      <div style="text-align:right">
        <div class="footer-label">TYPICAL</div>
        <div class="footer-val" id="fTypical"></div>
      </div>
    </div>

    <!-- Below the stats: notes are the least authoritative thing on the page,
         and they no longer sit in prime vertical space above the fold. -->
    <div class="notes" id="notesWrap">
      <div class="notes-head">NOTES</div>
      <div id="notesList"></div>
    </div>

  </div>

  <div class="links-row">
    <a class="ext-link" href="index.html">← <span class="lbl-wide">30-DAY PREMIUM PROCESSING (COMPLETE)</span><span class="lbl-narrow">PREMIUM PROCESSING</span></a>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — the only thing to edit
   ============================================================ */
const CONFIG = {
  // The hero shows elapsed hours, so this carries the actual approval time —
  // midnight would overstate elapsed by most of a day.
  approvalDate: new Date(2026, 7, 14, 14, 0, 0),   // Fri Aug 14, 2026, 2:00 PM
  typicalDays: 12,                                 // TYPICAL, not promised.

  // `own: true` marks a personal milestone rather than a USCIS status. All
  // completed stages render identically — the flag is documentation, not a
  // style hook — but the distinction matters when reconciling this list against
  // the portal: unmarked names are USCIS's verbatim wording and should not be
  // reworded.
  //
  // Note: "Tracking Number Received" is personal. USCIS's own wording for that
  // event is "Card Was Mailed To Me" — that is what the portal will display.
  stages: [
    { name: "Case Approved",              date: new Date(2026, 7, 14) },
    { name: "Case Approved In Portal",    date: new Date(2026, 7, 16), own: true },
    { name: "Card Was Produced",          date: new Date(2026, 7, 20) },
    { name: "Tracking Number Received",   date: new Date(2026, 7, 20), own: true },
    { name: "Card Delivered",             date: null }
  ],

  // Anything that is NOT a stage goes here — "no change today", phone calls,
  // portal quirks. Kept separate so an observation can never be mistaken for a
  // USCIS state change. Empty is fine; the whole block hides.
  notes: [
    { date: new Date(2026, 7, 21), text: "In transit. USPS expects delivery Sat Aug 22 by 9pm." }
  ],

  trackingNumber: "9205590153708662178619",   // empty = generic USPS link
  uscisUrl: "https://egov.uscis.gov/"
};

/* There is no guarantee on card delivery. typicalDays is a reference range,
   so nothing here counts down and nothing is ever "late" — past the typical
   range the grid turns amber, which means longer than usual, still normal. */

/* ---------- helpers ---------- */
const DAY_MS = 86400000;
const pad = n => String(n).padStart(2, "0");
function midnight(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
// Inclusive, matching index.html: the approval day itself is day 1.
function dayNumber(from, to) {
  return Math.floor((midnight(to) - midnight(from)) / DAY_MS) + 1;
}
function fmtDate(d) {
  return d.toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" });
}
function fmtShort(d) {
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }).toUpperCase();
}

/* ---------- static bits ---------- */
document.getElementById("uscis").href = CONFIG.uscisUrl;

// With a number, the link goes straight to that parcel and shows it. Without
// one it still goes somewhere useful — USPS's tracking page — rather than
// being a dead or hidden control.
const trackEl = document.getElementById("trackLink");
if (CONFIG.trackingNumber) {
  trackEl.textContent = CONFIG.trackingNumber + " ↗";
  trackEl.href = "https://tools.usps.com/go/TrackConfirmAction?tLabels=" +
                 encodeURIComponent(CONFIG.trackingNumber);
} else {
  trackEl.textContent = "USPS TRACKING ↗";
  trackEl.href = "https://tools.usps.com/tracking/?locale=en";
}

/* ---------- hero: days and hours, like index.html's clock ---------- */
const heroRow = document.getElementById("heroRow");
const heroUnits = ["D", "H"].map(unit => {
  const span = document.createElement("span");
  span.className = "hero-num";
  const val = document.createElement("span");
  const u = document.createElement("span");
  u.className = "hero-unit";
  u.textContent = unit;
  span.append(val, u);
  heroRow.appendChild(span);
  return val;
});

/* ---------- render ---------- */
function render() {
  const now = new Date();
  const today = midnight(now);
  const start = midnight(CONFIG.approvalDate);

  const stagesDone = CONFIG.stages.filter(s => s.date);
  const finalStage = CONFIG.stages[CONFIG.stages.length - 1];
  const delivered = !!finalStage.date;

  // Once delivered the page stops tracking an open wait and reports a result.
  const endDay = delivered ? midnight(finalStage.date) : today;
  const dayNum = Math.max(1, dayNumber(start, endDay));

  document.documentElement.style.setProperty("--status", delivered ? "var(--green)" : "var(--cyan)");

  /* Hero shows elapsed days and hours; the caption carries the inclusive day
     number. Both are true and they differ by one, so the page states each
     rather than leaving the reader to guess which one a bare number meant. */
  const endMoment = delivered ? finalStage.date : now;
  const elapsedMs = Math.max(0, endMoment - CONFIG.approvalDate);
  heroUnits[0].textContent = pad(Math.floor(elapsedMs / DAY_MS));
  heroUnits[1].textContent = pad(Math.floor((elapsedMs % DAY_MS) / 3600000));
  document.getElementById("heroLabel").textContent =
    delivered ? "ELAPSED FROM APPROVAL TO DELIVERY" : "DAYS ELAPSED SINCE APPROVAL";
  document.getElementById("heroCaption").textContent =
    delivered
      ? "DELIVERED ON DAY " + dayNum + " OF ~" + CONFIG.typicalDays + " TYPICAL"
      : "DAY " + dayNum + " OF ~" + CONFIG.typicalDays + " TYPICAL";

  /* status pill — never a failure state, only a description of where it sits */
  const pill = document.getElementById("statusPill");
  if (delivered) pill.textContent = "● CARD DELIVERED";
  else if (dayNum > CONFIG.typicalDays) pill.textContent = "● LONGER THAN TYPICAL";
  else pill.textContent = "● IN PROGRESS";
  if (!delivered && dayNum > CONFIG.typicalDays) {
    document.documentElement.style.setProperty("--status", "var(--amber)");
  }

  /* header date line */
  const wd = now.toLocaleDateString("en-US", { weekday: "short" }).toUpperCase();
  const iso = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
  document.getElementById("todayLine").textContent = wd + " · " + iso;

  /* day grid — grows past the typical range instead of clipping or wrapping */
  const totalCells = Math.max(CONFIG.typicalDays, dayNum);
  const grid = document.getElementById("dayGrid");
  grid.style.gridTemplateColumns = "repeat(" + totalCells + ", 1fr)";
  grid.innerHTML = "";
  for (let n = 1; n <= totalCells; n++) {
    const cell = document.createElement("div");
    cell.className = "day";
    const cellDate = new Date(start.getTime() + (n - 1) * DAY_MS);
    cell.title = "Day " + n + " · " + fmtDate(cellDate);
    // The whole vocabulary: elapsed days are lit, today pulses, future is dark.
    // No per-cell milestone markers — the pipeline is where events are read.
    const isPast = n <= dayNum;
    const over = n > CONFIG.typicalDays;
    if (isPast) cell.classList.add(over ? "over" : "lit");
    else if (over) cell.classList.add("over-future");
    if (delivered && n === dayNum) cell.classList.add("delivered");
    if (!delivered && n === dayNum) cell.classList.add("today");
    grid.appendChild(cell);
  }
  /* Footer closes the card with the three fixed dates of the wait. The typical
     date is derived, never hardcoded, and carries a tilde: ~12 days is a
     community average, not a USCIS commitment, so passing it is not a failure.
     Past it the value goes amber at most — never red. */
  const typicalEnd = new Date(start.getTime() + (CONFIG.typicalDays - 1) * DAY_MS);
  const pastTypical = !delivered && dayNum > CONFIG.typicalDays;
  document.getElementById("fApproved").textContent = fmtDate(CONFIG.approvalDate);
  const portal = CONFIG.stages[1] && CONFIG.stages[1].date;
  document.getElementById("fPortal").textContent = portal ? fmtDate(portal) : "—";
  const fTyp = document.getElementById("fTypical");
  fTyp.textContent = "~" + fmtDate(typicalEnd);
  fTyp.style.color = pastTypical ? "var(--amber)" : "var(--text)";

  /* pipeline */
  const pipe = document.getElementById("pipeline");
  pipe.innerHTML = "";
  const nextIdx = CONFIG.stages.findIndex(s => !s.date);
  CONFIG.stages.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "stage" + (s.date ? " done" : "") + (i === nextIdx ? " next" : "") +
                    (s.own ? " own" : "") +
                    (i === CONFIG.stages.length - 1 ? " final" : "");
    const dot = document.createElement("div"); dot.className = "stage-dot";
    const nm = document.createElement("div"); nm.className = "stage-name"; nm.textContent = s.name;
    const dt = document.createElement("div"); dt.className = "stage-date";
    dt.textContent = s.date ? fmtDate(s.date) : (i === nextIdx ? "EXPECTED NEXT" : "—");
    row.append(dot, nm, dt);
    pipe.appendChild(row);
  });

  /* notes */
  const notesWrap = document.getElementById("notesWrap");
  const list = document.getElementById("notesList");
  list.innerHTML = "";
  document.body.classList.toggle("has-notes", CONFIG.notes.length > 0);
  if (!CONFIG.notes.length) {
    notesWrap.style.display = "none";
  } else {
    notesWrap.style.display = "";
    CONFIG.notes.slice().sort((a, b) => a.date - b.date).forEach(n => {
      const el = document.createElement("div");
      el.className = "note";
      const d = document.createElement("span");
      d.className = "note-date";
      d.textContent = fmtShort(n.date) + " — ";
      el.appendChild(d);
      el.appendChild(document.createTextNode(n.text));
      list.appendChild(el);
    });
  }

  /* The number that signals whether anything is actually stuck. Days elapsed
     can be large and fine; a long gap with no stage change is the thing worth
     acting on, so this one goes amber at a week. */
  const moments = stagesDone.map(s => midnight(s.date))
    .concat(CONFIG.notes.map(n => midnight(n.date)));
  const lastMove = new Date(Math.max.apply(null, moments));
  const sinceMove = Math.max(0, Math.round((today - lastMove) / DAY_MS));
  const smEl = document.getElementById("sinceMove");
  smEl.textContent = delivered ? "—" : sinceMove;
  smEl.style.color = (!delivered && sinceMove >= 7) ? "var(--amber)" : "var(--text)";
  document.getElementById("sinceMoveLabel").textContent =
    delivered ? "COMPLETE" : "DAYS SINCE LAST STAGE";

  document.getElementById("stageCount").textContent =
    stagesDone.length + " / " + CONFIG.stages.length;
}

render();

/* Ticks by the hour, not the second — the hero's finest unit is hours, and a
   seconds display would imply a precision this process does not have. */
(function scheduleHour() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(now.getHours() + 1, 0, 5, 0);
  setTimeout(() => { render(); scheduleHour(); }, next - now);
})();
</script>
</body>
</html>
